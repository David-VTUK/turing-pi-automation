loki:
  deploymentMode: Monolithic

  singleBinary:
    enabled: true
    replicas: 2
    extraArgs:
      - -config.expand-env=true
    extraEnvFrom:
      - secretRef:
          name: loki-s3-credentials

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
    pattern_ingester:
      enabled: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    rulerConfig:
      enable_api: true
    storage:
      type: s3
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin
      s3:
        region: eu-homelab-1
        accessKeyId: "${AWS_ACCESS_KEY_ID}"
        secretAccessKey: "${AWS_SECRET_ACCESS_KEY}"
        endpoint: https://rustfs.lab.virtualthoughts.co.uk
        s3ForcePathStyle: true

  minio:
    enabled: false

  gateway:
    enabled: true