rustfs:
  replicaCount: 4
  secret:
    existingSecret: rustfs-creds
  ingress:
    enabled: false
  gatewayApi:
    enabled: true
    gatewayClass: cilium
    listeners:
      http:
        name: http-to-https-redirect
        port: 80
      https:
        name: https-gateway
        port: 443
    hostname: rustfs.lab.virtualthoughts.co.uk # Console hostname.
    httpToHttpsRedirect: false # handled by api gateway
    existingGateway:
      name: cilium-api-gateway
      namespace: cilium
  storageclass:
    name: longhorn
    dataStorageSize: 5Gi
    logStorageSize: 5Gi