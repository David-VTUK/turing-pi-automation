apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mktxp-alerts
  namespace: kube-prometheus-stack
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: mikrotik-mktxp.rules
      rules:

      - alert: MikroTikHighCPULoad
        expr: mktxp_system_cpu_load > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on Router {{ `{{ $labels.routerboard_name }}` }}"
          description: "CPU load on {{ `{{ $labels.routerboard_name }}` }} is currently {{ `{{ $value | printf \"%.2f\" }}` }}%."

      - alert: MikroTikLowMemory
        expr: (mktxp_system_free_memory / mktxp_system_total_memory) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low memory on Router {{ `{{ $labels.routerboard_name }}` }}"
          description: "{{ `{{ $labels.routerboard_name }}` }} has less than 10% free memory remaining."

      - alert: MikroTikHighCPUTemperature
        expr: mktxp_system_cpu_temperature > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU temperature on {{ `{{ $labels.routerboard_name }}` }}"
          description: "CPU Temperature on {{ `{{ $labels.routerboard_name }}` }} is currently {{ `{{ $value }}` }}°C."

      - alert: MikroTikHighPHYTemperature
        expr: mktxp_system_phy_temperature > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PHY temperature on {{ `{{ $labels.routerboard_name }}` }}"
          description: "PHY Temperature on {{ `{{ $labels.routerboard_name }}` }} is currently {{ `{{ $value }}` }}°C."

      - alert: MikroTikHighBoard1Temperature
        expr: mktxp_system_board_temperature1 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Board 1 temperature PHY on {{ `{{ $labels.routerboard_name }}` }}"
          description: "Board 1 Temperature on {{ `{{ $labels.routerboard_name }}` }} is currently {{ `{{ $value }}` }}°C."


      - alert: MikroTikHighBoard2Temperature
        expr: mktxp_system_board_temperature2 > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Board 2 temperature on {{ `{{ $labels.routerboard_name }}` }}"
          description: "Board 2 Temperature on {{ `{{ $labels.routerboard_name }}` }} is currently {{ `{{ $value }}` }}°C."

      - alert: MikroTikHighSFPTemperature
        expr: mktxp_interface_sfp_temperature > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High SFP temperature on {{ `{{ $labels.routerboard_name }}` }}, interface {{ `{{ $labels.name }}` }}"
          description: "SFP Temperature on {{ `{{ $labels.routerboard_name }}` }}, interface {{ `{{ $labels.name }}` }} is currently {{ `{{ $value }}` }}°C."

      - alert: MikroTikHighSwitchTemperature
        expr: mktxp_system_switch_temperature > 70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Switch temperature on {{ `{{ $labels.routerboard_name }}` }}"
          description: "Switch Temperature on {{ `{{ $labels.routerboard_name }}` }} is currently {{ `{{ $value }}` }}°C."



      # ==========================================
      # Network & Interface Alerts
      # ==========================================

      - alert: MikroTikHighRXError
        expr: increase(mktxp_interface_rx_error_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High RX error rate on {{ `{{ $labels.routerboard_name }}` }}, interface {{ `{{ $labels.name}}` }}"
          description: "RX error on {{ `{{ $labels.routerboard_name }}` }} over the last 5mins is currently {{ `{{ $value }}` }}."

      - alert: MikroTikHighTXError
        expr: increase(mktxp_interface_tx_error_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High TX error rate on {{ `{{ $labels.routerboard_name }}` }}, interface {{ `{{ $labels.name}}` }}"
          description: "TX error on {{ `{{ $labels.routerboard_name }}` }} over the last 5mins is currently {{ `{{ $value }}` }}."

      # ==========================================
      # Software & OS
      # ==========================================

      - alert: MikroTikRouterOSUpdate
        expr: mktxp_system_update_available != 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "RouterOS update available on {{ `{{ $labels.routerboard_name }}` }}"
          description: "{{ `{{ $labels.newest_version }}` }} is available for {{ `{{ $labels.routerboard_name }}` }}."